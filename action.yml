name: On-demand self-hosted AWS EC2 runner for GitHub Actions
description: GitHub Action for automatic creation and registration AWS EC2 instance as a GitHub Actions self-hosted runner.
author: Volodymyr Machula
branding:
  icon: 'box'
  color: 'orange'
inputs:
  mode:
    description: >-
      Specify here which mode you want to use:
        - 'start' - to start a new runner;
        - 'stop' - to stop the previously created runner.
        - 'default' - to make ubuntu-latest as default;
    required: true
    default: "default"
  github-token:
    description: >-
      GitHub Personal Access Token with the 'repo' scope assigned.
    required: true
  ec2-image-id:
    description: >-
      EC2 Image Id (AMI). The new runner will be launched from this image.
      This input is required if you use the 'start' mode.
    required: false
  ec2-instance-type:
    description: >-
      EC2 Instance Type. 
      This input is required if you use the 'start' mode.
    required: false
  subnet-id:
    description: >-
      VPC Subnet Id. The subnet should belong to the same VPC as the specified security group.
      This input is required if you use the 'start' mode.
    required: false
  security-group-id:
    description: >-
      EC2 Security Group Id. 
      The security group should belong to the same VPC as the specified subnet.
      The runner doesn't require any inbound traffic. However, outbound traffic should be allowed.
      This input is required if you use the 'start' mode.
    required: false
  label:
    description: >-
      Name of the unique label assigned to the runner.
      The label is used to remove the runner from GitHub when the runner is not needed anymore.
      This input is required if you use the 'stop' mode.
    required: false
  ec2-instance-ids:
    description: >-
      EC2 Instance Id(s) of the created runner(s).
      The Id(s) are used to terminate the EC2 instance(s) when the runner is not needed anymore.
      This input is required if you use the 'stop' mode.
    required: false
    default: 'null'
  iam-role-name:
    description: >-
      IAM Role Name to attach to the created EC2 instance.
      This requires additional permissions on the AWS role used to launch instances.
    required: false
  aws-resource-tags:
    description: >-
      Tags to attach to the launched EC2 instance and volume.
      This must be a stringified array of AWS Tag objects, with both Key and Value fields,
      for example: '[{"Key": "TagKey1", "Value": "TagValue1"}, {"Key": "TagKey2", "Value": "TagValue2"}]'
    required: false
    default: '[]'
  key-pair:
    description: >-
      attach key pair pem file to login
    required : false
    default: 'aws-stage'
  host-name:
    description:
      This will be the hostname set for self hosted runner if none is specified then we will default to self-hosted.
    required: false
    default: "self-hosted"
  runner-count:
    description: >-
      Number of runners to create, defaults to 1
    required: false
    default: '1'
  runner-mode:
    description: >-
      Runner allocation mode:
        - 'single' - One runner per EC2 instance (default)
        - 'multi' - Multiple runners on a single EC2 instance
        - 'fleet' - Mixed instance types based on ranges (one runner per instance)
    required: false
    default: 'single'
  instance-type-ranges:
    description: >-
      JSON array of 1-based starting indices for each instance type tier.
      Used only with runner-mode: fleet.
      Example: '[1, 5, 19]' means tier 1 starts at runner 1, tier 2 at runner 5, tier 3 at runner 19.
    required: false
    default: '[]'
  instance-types:
    description: >-
      JSON array of EC2 instance types corresponding to each range.
      Used only with runner-mode: fleet.
      Example: '["c7a.8xlarge", "m5a.large", "m6a.2xlarge"]'
    required: false
    default: '[]'
  runner-home-dir:
    description: >-
      Directory that contains actions-runner software and scripts. E.g. /home/runner/actions-runner.
    required: false
  pre-runner-script:
    description: >-
      Specifies bash commands to run before the runner starts. It's useful for installing dependencies with apt-get, yum, dnf, etc.
    required: false
  market-type:
    description: >-
      Specifies the market (purchasing) option for the instance:
        - 'spot' - Use a spot instance
    required: false

outputs:
  label:
    description: >-
      Name of the unique label assigned to the runner.
      The label is used in two cases:
      - to use as the input of 'runs-on' property for the following jobs;
      - to remove the runner from GitHub when it is not needed anymore.
  ec2-instance-ids:
    description: >-
      EC2 Instance Id(s) of the created runner(s).
      The id is used to terminate the EC2 instance when the runner is not needed anymore.
runs:
  using: node16
  main: ./dist/index.js
